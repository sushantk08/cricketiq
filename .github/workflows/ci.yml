name: CricketIQ CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cricketiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare Historical Cricket Data
        run: |
          mkdir -p "$HOME/Downloads"

          curl -L "https://cricsheet.org/downloads/t20s.zip" \
            -o "$HOME/Downloads/t20s.zip"

          python - <<'PY'
          from pathlib import Path

          from backend.app.data.cricsheet_importer import (
              write_training_dataset,
              write_player_historical_dataset,
          )

          output_dir = Path("backend/data/historical")
          output_dir.mkdir(parents=True, exist_ok=True)

          win_probability_path = output_dir / "win_probability.csv"
          player_history_path = output_dir / "player_delivery_history.csv"

          training_rows = write_training_dataset(win_probability_path)
          player_rows = write_player_historical_dataset(player_history_path)

          print(
              f"Historical datasets generated successfully: "
              f"{training_rows} win-probability rows, "
              f"{player_rows} player-history rows."
          )
          PY

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/cricketiq
        run: |
          cd backend
          alembic upgrade head

      - name: Seed Database
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/cricketiq
        run: |
          python -m backend.app.database.seed

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/cricketiq
          JWT_SECRET_KEY: ci-test-secret-key
          LLM_MODEL: openai/gpt-oss-20b
          MONGODB_URL: mongodb://localhost:27017
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python -m pytest backend/tests -v

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build React Assets
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Build
        run: |
          docker compose build