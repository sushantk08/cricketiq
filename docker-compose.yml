services:
  postgres:
    image: postgres:15-alpine
    container_name: cricketiq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cricketiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cricketiq_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/cricketiq
      - JWT_SECRET_KEY=cricketiq-production-secret-key-change-in-prod
      - LLM_MODEL=openai/gpt-oss-20b
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cricketiq_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: